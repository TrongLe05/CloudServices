services:
  # ----------------------------------------------------
  # 1. Database: Microsoft SQL Server 2022
  # ----------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cloudservices-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-CloudServices@2026!}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD:-CloudServices@2026!}' -Q 'SELECT 1' -C -b -r 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cloudservices-network

  # ----------------------------------------------------
  # 2. Backend: ASP.NET Core 10 Web API
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudservices-backend
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CloudServicesDb;User Id=sa;Password=${SA_PASSWORD:-CloudServices@2026!};MultipleActiveResultSets=true;TrustServerCertificate=True;
      - JwtSettings__Secret=${JWT_SECRET:-SuperSecretKeyForCloudServicesProject2026!@#$}
      - JwtSettings__Issuer=CloudServicesAPI
      - JwtSettings__Audience=CloudServicesClient
      - JwtSettings__ExpiryMinutes=60
      - AppSettings__Domain=${DOMAIN:-http://localhost:8080}
      - AppSettings__FrontendUrl=${FRONTEND_URL:-http://localhost:3000}
      - PayOS__ClientId=${PAYOS_CLIENT_ID:-076b1838-a54d-42b0-8e98-376eb33f892a}
      - PayOS__ApiKey=${PAYOS_API_KEY:-cb718cbd-d55d-4575-90c9-5825e13e6b2c}
      - PayOS__ChecksumKey=${PAYOS_CHECKSUM_KEY:-cf8acffb4b53af755fb60f1b0703f2667dc5d8c7f78c8f2e345f63e18c9761fe}
      - Resend__ApiKey=${RESEND_API_KEY:-}
      - Resend__Sender=${RESEND_SENDER:-onboarding@resend.dev}
    networks:
      - cloudservices-network

  # ----------------------------------------------------
  # 3. Frontend: Next.js 16 (App Router + Turbopack)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend/cloud-services-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_TINYMCE_API_KEY: ${NEXT_PUBLIC_TINYMCE_API_KEY:-lo22j7heipnhkk80mk7x7bqk9ibuus8tz5gqz145z52ymorj}
        AUTH_SECRET: ${AUTH_SECRET:-e4f95d4e244405a2588f95d36854429a77e6299e1d6ab520e804c5d7d594ec86}
    container_name: cloudservices-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - AUTH_SECRET=${AUTH_SECRET:-e4f95d4e244405a2588f95d36854429a77e6299e1d6ab520e804c5d7d594ec86}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
    networks:
      - cloudservices-network

# ----------------------------------------------------
# Networks & Volumes
# ----------------------------------------------------
networks:
  cloudservices-network:
    driver: bridge

volumes:
  mssql_data:
    driver: local
